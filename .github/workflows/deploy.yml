name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Force GitHub-hosted JavaScript actions to run on Node.js 24 to avoid the
      # upcoming deprecation of Node.js 20. This is safe to opt into now.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'big-hike-app/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: big-hike-app

      - name: Build web export
        run: npx expo export --platform web
        working-directory: big-hike-app

      - name: Inspect web export output
        run: |
          echo "PWD: $(pwd)"
          ls -la dist || echo "No dist directory found"
        working-directory: big-hike-app

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './big-hike-app/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
